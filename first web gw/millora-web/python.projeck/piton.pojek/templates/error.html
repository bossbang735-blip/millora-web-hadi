<!DOCTYPE html>

<html>
<head>
    <title>Error - Millora</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd900, #ff0000);
        color: rgb(255, 255, 255);
    }

    .error-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        width: 320px;
    }

    h2 {
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 20px;
    }

    .emoji {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        border-radius: 25px;
        background: linear-gradient(135deg, #ff2f00, #ffea00);
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 25px black;
        background: linear-gradient(135deg, #ff2ebd, #ff7ae9);
    }
</style>

</head>

<body>

<div class="error-box">
    <div class="emoji">🗿</div>
    <h2>Login Gagal Bro!</h2>
    <p>Cek lagi email atau passwordnya ya cintah</p>

<a href="/" class="btn">Coba Lagi</a>

</div>

</body>
</html>
