<!DOCTYPE html>
<html>
<head>
    <title>Login - Millora</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd900, #ff0000);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #ff2f00, #ffea00);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgb(0, 0, 0);
            background: linear-gradient(135deg, #ff2ebd, #ff7ae9);
        }

        a {
            color: white;
            font-weight: bold;
        }

        /* 😎 KARAKTER */
        .character {
            position: fixed;
            bottom: 20px;
            right: 20px;
            perspective: 500px;
        }

        .face {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #fff176, #ff6f00);
            border-radius: 50%;
            position: relative;
        }

        .eye {
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 35px;
        }

        .eye.left { left: 20px; }
        .eye.right { right: 20px; }

        .pupil {
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 8px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <!-- 🔥 INI YANG DIPERBAIKI -->
    <form action="/login" method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <!-- 🔥 REGISTER LINK (KELIHATAN SEKARANG) -->
    <p>Belum punya akun? <a href="/register">Register</a></p>
</div>

<!-- 😎 KARAKTER -->
<div class="character">
    <div class="face">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
    </div>
</div>

<script>
const pupils = document.querySelectorAll(".pupil");

document.addEventListener("mousemove", (e) => {
    pupils.forEach(pupil => {
        const rect = pupil.parentElement.getBoundingClientRect();

        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;

        const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);

        const x = Math.cos(angle) * 6;
        const y = Math.sin(angle) * 6;

        pupil.style.transform = `translate(${x}px, ${y}px)`;
    });
});
</script>

</body>
</html>
