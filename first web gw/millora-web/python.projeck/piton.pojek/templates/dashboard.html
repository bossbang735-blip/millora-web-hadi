<!DOCTYPE html>
<html>
<head>
    <title>Millora - Simulasi Produksi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: '', Courier, monospace, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fecf00, hsl(0, 100%, 50%));
            color: white;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        /* 🔥 LOGIN TEXT */
        .login-text {
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            background: rgba(16, 125, 164, 0.1);
            backdrop-filter: blur(5px);
        }

        .cards {
            display: flex;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .card {
            color: black;
            background: rgb(255, 255, 255);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 20px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .value {
            font-size: 28px;
            margin-top: 10px;
            font-weight: bold;
        }

        canvas {
            background: rgb(255, 255, 255);
            border-radius: 15px;
            padding: 10px;
            margin-top: 20px;
        }

        /* 🔥 LOGOUT BUTTON */
        .logout-wrapper {
            margin-top: 40px;
        }

        .logout-btn {
            display: inline-block;
            padding: 12px 33px;
            background: linear-gradient(135deg, #fff200, #ffa600, #ff5900);
            color: rgb(7, 0, 0);
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .logout-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgb(0, 0, 0);
            background: linear-gradient(135deg, #ab0075, #ff2adc, #ff82ea);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Simulasi Produksi Minyak - Millora</h1>

    <p class="login-text">Login sebagai: Hadi Ganteng</p>

    <div class="cards">
        <div class="card">
            TBS Masuk (Ton/Jam)
            <div class="value" id="tbs">0</div>
        </div>

        <div class="card">
            Produksi CPO (Ton/Hari)
            <div class="value" id="cpo">0</div>
        </div>

        <div class="card">
            Temperatur Boiler (°C)
            <div class="value" id="boiler">0</div>
        </div>

        <div class="card">
            Tekanan Steam (Bar)
            <div class="value" id="steam">0</div>
        </div>
    </div>

    <canvas id="chart" height="100"></canvas>

    <div class="logout-wrapper">
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
</div>

<script>
let tbsEl = document.getElementById("tbs");
let cpoEl = document.getElementById("cpo");
let boilerEl = document.getElementById("boiler");
let steamEl = document.getElementById("steam");

let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            label: "Produksi CPO",
            data: [],
            borderColor: "black",
            fill: false
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        }
    }
});

function updateData() {

    let tbs = (20 + Math.random() * 10).toFixed(1);
    let cpo = (100 + Math.random() * 20).toFixed(1);
    let boiler = (170 + Math.random() * 20).toFixed(1);
    let steam = (7 + Math.random() * 2).toFixed(2);

    tbsEl.innerText = tbs;
    cpoEl.innerText = cpo;
    boilerEl.innerText = boiler;
    steamEl.innerText = steam;

    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(cpo);

    if (chart.data.labels.length > 10) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();
}

setInterval(updateData, 2000);
</script>

</body>
</html>
